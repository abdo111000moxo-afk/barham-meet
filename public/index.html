<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Boulaqi Meet - منصة الاجتماعات التفاعلية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h2><i class="fa-solid fa-video text-emerald"></i> Al-Boulaqi Meet</h2>
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="username-input" placeholder="أدخل اسمك هنا...">
            </div>
            <div class="form-group">
                <label>الصورة الشخصية</label>
                <input type="file" id="userpic-input" accept="image/*">
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="createRoom()"><i class="fa-solid fa-plus"></i> إنشاء غرفة جديدة (Host)</button>
                <div class="divider">أو</div>
                <div class="join-box">
                    <input type="text" id="room-id-input" placeholder="كود الغرفة...">
                    <button class="btn btn-secondary" onclick="joinRoom()"><i class="fa-solid fa-right-to-bracket"></i> دخول (حاضر)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. شاشة رابط الغرفة -->
    <div id="share-screen" class="screen">
        <div class="login-card text-center">
            <h3>تم إنشاء الغرفة بنجاح! 🎉</h3>
            <p>شارك هذا الرابط مع الحضور لإنضمامهم:</p>
            <div class="link-box">
                <input type="text" id="created-room-link" readonly>
                <button class="btn btn-copy" onclick="copyRoomLink()"><i class="fa-regular fa-copy"></i> نسخ</button>
            </div>
            <button class="btn btn-success mt-4" onclick="enterRoom()"><i class="fa-solid fa-arrow-right"></i> دخول الغرفة</button>
        </div>
    </div>

    <!-- 3. الواجهة الرئيسية بالتصميم الجانبي المحدث -->
    <div id="room-screen" class="screen">
        <div class="app-layout">
            
            <!-- القائمة الجانبية Sidebar -->
            <aside class="app-sidebar">
                <div class="brand">
                    <i class="fa-solid fa-video"></i>
                    <span>Al-Boulaqi Meet</span>
                </div>

                <nav class="sidebar-nav">
                    <button class="nav-item active" data-tab="main" onclick="switchTab('main')">
                        <i class="fa-solid fa-users"></i> المشتركين
                    </button>
                    <button class="nav-item" data-tab="whiteboard" onclick="switchTab('whiteboard')">
                        <i class="fa-solid fa-chalkboard"></i> السبورة
                    </button>
                    <button class="nav-item" data-tab="cameras" onclick="switchTab('cameras')">
                        <i class="fa-solid fa-video"></i> الكاميرات
                    </button>
                    <button class="nav-item" data-tab="screen" onclick="switchTab('screen')">
                        <i class="fa-solid fa-desktop"></i> مشاركة الشاشة
                    </button>
                    <button class="nav-item" data-tab="chat" onclick="switchTab('chat')">
                        <i class="fa-solid fa-comments"></i> المحادثة المباشرة
                    </button>
                    <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
                        <i class="fa-solid fa-user-gear"></i> ملفي الشخصي
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <button class="btn btn-warning btn-block mb-2" id="btn-raise-hand" onclick="raiseHand()"><i class="fa-solid fa-hand"></i> طلب الكلمة</button>
                    <button class="btn btn-danger btn-block" onclick="leaveRoom()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                </div>
            </aside>

            <!-- منطقة العمل الرئيسية -->
            <div class="main-wrapper">
                <header class="top-header">
                    <div class="room-code-badge">
                        كود الغرفة: <strong id="current-room-id">------</strong>
                    </div>
                </header>

                <main class="content-body">
                    <!-- تبويب المشتركين -->
                    <section id="tab-main" class="tab-content active">
                        <h3><i class="fa-solid fa-users"></i> الحضور في الغرفة</h3>
                        <div class="users-grid" id="users-grid"></div>
                    </section>

                    <!-- تبويب السبورة -->
                    <section id="tab-whiteboard" class="tab-content">
                        <div class="whiteboard-toolbar" id="whiteboard-toolbar">
                            <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')"><i class="fa-solid fa-pen"></i> قلم</button>
                            <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')"><i class="fa-solid fa-eraser"></i> استيكة</button>
                            <input type="color" id="brush-color" value="#10b981" title="لون القلم">
                            <input type="range" id="brush-size" min="2" max="40" value="5" title="حجم الخط">
                            <select id="bg-selector" onchange="changeBoardBg(this.value)">
                                <option value="bg-white">خلفية بيضاء</option>
                                <option value="bg-dark">خلفية سوداء</option>
                                <option value="bg-lines">سطور كشكول</option>
                                <option value="bg-grid">مربعات شبكية</option>
                            </select>
                            
                            <label class="btn btn-secondary host-only" style="cursor: pointer;">
                                <i class="fa-solid fa-file-pdf"></i> رفع PDF
                                <input type="file" id="pdf-input" accept="application/pdf" onchange="loadPDF(event)" hidden>
                            </label>

                            <button class="btn-danger host-only" onclick="clearBoard()"><i class="fa-solid fa-trash"></i> مسح الكل</button>
                            <button class="btn-success" onclick="downloadBoard()"><i class="fa-solid fa-download"></i> تصدير صورة</button>
                        </div>
                        <div class="canvas-container bg-white" id="canvas-container">
                            <canvas id="whiteboard"></canvas>
                        </div>
                    </section>

                    <!-- تبويب الكاميرات -->
                    <section id="tab-cameras" class="tab-content">
                        <div class="cameras-grid" id="cameras-grid"></div>
                        <div class="floating-cam" id="floating-cam">
                            <video id="my-pip-video" autoplay muted playsinline></video>
                            <span>كاميرتك</span>
                        </div>
                    </section>

                    <!-- تبويب مشاركة الشاشة -->
                    <section id="tab-screen" class="tab-content">
                        <div class="screen-controls mb-3">
                            <button class="btn btn-primary host-only" onclick="startScreenShare()"><i class="fa-solid fa-desktop"></i> بدء مشاركة الشاشة</button>
                            <button class="btn btn-warning" id="presentation-btn" onclick="togglePresentation()"><i class="fa-solid fa-expand"></i> وضعية الشرح للجميع</button>
                            <button class="btn btn-secondary" id="laser-btn" onclick="toggleLaser()"><i class="fa-solid fa-wand-magic-sparkles"></i> مؤشر الليزر</button>
                            <button class="btn btn-danger host-only" id="record-btn" onclick="toggleRecording()"><i class="fa-solid fa-circle"></i> بدء تسجيل المحاضرة</button>
                        </div>
                        <div class="screen-viewer-wrapper" id="screen-wrapper">
                            <video id="shared-screen-video" autoplay playsinline></video>
                            <div id="laser-pointer" class="laser-pointer"></div>
                        </div>
                    </section>

                    <!-- تبويب الشات المخصص -->
                    <section id="tab-chat" class="tab-content">
                        <div class="modern-chat-card">
                            <div class="chat-header-bar">
                                <h3><i class="fa-solid fa-comments"></i> المحادثة المباشرة</h3>
                            </div>
                            <div class="modern-chat-messages" id="chat-messages">
                                <!-- الرسائل بتنزل هنا -->
                            </div>
                            <div class="chat-input-bar">
                                <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatKey(event)">
                                <button class="btn btn-primary" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i> إرسال</button>
                            </div>
                        </div>
                    </section>

                    <!-- تبويب الملف الشخصي -->
                    <section id="tab-profile" class="tab-content">
                        <div class="profile-card">
                            <div class="profile-avatar-wrapper">
                                <img id="profile-preview-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile">
                            </div>
                            <h3 id="profile-name-display">اسمك</h3>
                            <p class="text-muted">المرتبة في الغرفة: <span id="profile-role-display">عضو</span></p>

                            <div class="profile-edit-box">
                                <label>تغيير اسم العرض:</label>
                                <input type="text" id="edit-profile-name" class="form-control mb-3" placeholder="أدخل اسم جديد...">
                                <button class="btn btn-success" onclick="updateProfile()"><i class="fa-solid fa-check"></i> حفظ التحديثات</button>
                            </div>
                        </div>
                    </section>

                </main>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
