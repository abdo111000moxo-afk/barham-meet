<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Boulaqi Meet - منصة الاجتماعات التفاعلية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <!-- 1. شاشة التسجيل لأول مرة (تظهر مرة واحدة فقط) -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h2><i class="fa-solid fa-video text-emerald"></i> Al-Boulaqi Meet</h2>
            <p class="subtitle mb-3">مرحباً بك! أدخل بياناتك المرة الأولى فقط</p>
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="username-input" placeholder="أدخل اسمك هنا...">
            </div>
            <div class="form-group">
                <label>الصورة الشخصية</label>
                <input type="file" id="userpic-input" accept="image/*">
            </div>

            <button class="btn btn-primary btn-block" onclick="saveInitialProfile()">حفظ ومتابعة <i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <!-- 2. شاشة التحكم الرئيسية (Home Dashboard) بعد حفظ البيانات -->
    <div id="home-screen" class="screen">
        <div class="login-card">
            <div class="home-header">
                <h2><i class="fa-solid fa-video text-emerald"></i> Al-Boulaqi Meet</h2>
                <button class="btn-settings-icon" onclick="openSettingsModal()" title="إعدادات الملف الشخصي"><i class="fa-solid fa-gear"></i></button>
            </div>
            
            <div class="user-welcome-box">
                <img id="home-user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User">
                <div>
                    <h4 id="home-user-name">أهلاً بك!</h4>
                    <small style="color: #94a3b8;">جاهز للبدء؟</small>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="createRoom()"><i class="fa-solid fa-plus"></i> إنشاء غرفة جديدة (Host)</button>
                <div class="divider">أو</div>
                <div class="join-box">
                    <input type="text" id="room-id-input" placeholder="كود الغرفة...">
                    <button class="btn btn-secondary" onclick="joinRoom()"><i class="fa-solid fa-right-to-bracket"></i> دخول (حاضر)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ⚙️ نافذة الإعدادات المنبثقة (Modal) لتعديل الاسم والصورة -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-gear"></i> إعدادات الملف الشخصي</h3>
                <button class="btn-close-modal" onclick="closeSettingsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="profile-avatar-wrapper text-center mb-3">
                    <img id="modal-preview-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile">
                </div>
                <div class="form-group">
                    <label>تعديل اسم العرض:</label>
                    <input type="text" id="modal-username-input" class="form-control" placeholder="الاسم جديد...">
                </div>
                <div class="form-group">
                    <label>تغيير الصورة الشخصية:</label>
                    <input type="file" id="modal-userpic-input" accept="image/*">
                </div>
                <button class="btn btn-success btn-block" onclick="saveSettingsChanges()"><i class="fa-solid fa-check"></i> حفظ التحديثات</button>
            </div>
        </div>
    </div>

    <!-- 3. شاشة رابط الغرفة للداعي -->
    <div id="share-screen" class="screen">
        <div class="login-card text-center">
            <h3>تم إنشاء الغرفة بنجاح! 🎉</h3>
            <p>شارك هذا الرابط مع الحضور للانضمام:</p>
            <div class="link-box">
                <input type="text" id="created-room-link" readonly>
                <button class="btn btn-copy" onclick="copyRoomLink()"><i class="fa-regular fa-copy"></i> نسخ</button>
            </div>
            <button class="btn btn-success mt-4" onclick="enterRoom()"><i class="fa-solid fa-arrow-right"></i> دخول الغرفة</button>
        </div>
    </div>

    <!-- 4. الواجهة الرئيسية للغرفة -->
    <div id="room-screen" class="screen">
        <div class="app-layout">
            
            <aside class="app-sidebar">
                <div class="brand">
                    <i class="fa-solid fa-video"></i>
                    <span>Al-Boulaqi Meet</span>
                </div>

                <nav class="sidebar-nav">
                    <button class="nav-item active" data-tab="main" onclick="switchTab('main')">
                        <i class="fa-solid fa-users"></i> المشتركين
                    </button>
                    <button class="nav-item" data-tab="whiteboard" onclick="switchTab('whiteboard')">
                        <i class="fa-solid fa-chalkboard"></i> السبورة
                    </button>
                    <button class="nav-item" data-tab="cameras" onclick="switchTab('cameras')">
                        <i class="fa-solid fa-video"></i> الكاميرات
                    </button>
                    <button class="nav-item" data-tab="screen" onclick="switchTab('screen')">
                        <i class="fa-solid fa-desktop"></i> مشاركة الشاشة
                    </button>
                    <button class="nav-item nav-item-chat" data-tab="chat" onclick="switchTab('chat')">
                        <i class="fa-solid fa-comments"></i> المحادثة
                        <span id="chat-badge" class="badge-unread hidden">0</span>
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <button class="btn btn-warning btn-block mb-2" id="btn-raise-hand" onclick="raiseHand()"><i class="fa-solid fa-hand"></i> طلب الكلمة</button>
                    <button class="btn btn-danger btn-block" onclick="leaveRoom()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                </div>
            </aside>

            <div class="main-wrapper">
                <header class="top-header">
                    <div class="room-code-badge">
                        كود الغرفة: <strong id="current-room-id">------</strong>
                    </div>
                </header>

                <main class="content-body">
                    <!-- تبويب المشتركين -->
                    <section id="tab-main" class="tab-content active">
                        <h3><i class="fa-solid fa-users"></i> الحضور في الغرفة</h3>
                        <div class="users-grid" id="users-grid"></div>
                    </section>

                    <!-- تبويب السبورة التفاعلية -->
                    <section id="tab-whiteboard" class="tab-content full-content">
                        <div class="floating-toolbar">
                            <div class="tool-group">
                                <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')" title="قلم"><i class="fa-solid fa-pen"></i></button>
                                <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="استيكة"><i class="fa-solid fa-eraser"></i></button>
                                <input type="color" id="brush-color" value="#10b981" title="لون الخط">
                                <input type="range" id="brush-size" min="2" max="40" value="5" title="سمك الخط">
                            </div>

                            <div class="tool-group">
                                <select id="bg-selector" onchange="changeBoardBg(this.value)">
                                    <option value="bg-white">⚪ بيضاء</option>
                                    <option value="bg-dark">⚫ سوداء</option>
                                    <option value="bg-lines">📖 سطور</option>
                                    <option value="bg-grid">🏁 مربعات</option>
                                </select>
                                <label class="tool-btn-file host-only" title="رفع ملف PDF">
                                    <i class="fa-solid fa-file-pdf"></i>
                                    <input type="file" id="pdf-input" accept="application/pdf" onchange="loadPDF(event)" hidden>
                                </label>
                            </div>

                            <div class="tool-group page-controls">
                                <button class="btn-sm-tool" onclick="prevBoardPage()"><i class="fa-solid fa-chevron-right"></i></button>
                                <span id="page-num-display">1 / 1</span>
                                <button class="btn-sm-tool" onclick="nextBoardPage()"><i class="fa-solid fa-chevron-left"></i></button>
                                <button class="btn-sm-tool host-only btn-add-page" onclick="addBoardPage()" title="إضافة صفحة"><i class="fa-solid fa-plus"></i></button>
                            </div>

                            <div class="tool-group">
                                <button class="btn-sm-tool btn-danger-tool host-only" onclick="clearBoard()" title="مسح الصفحة الحالية"><i class="fa-solid fa-trash"></i></button>
                                <button class="btn-sm-tool btn-success-tool" onclick="downloadBoard()" title="تحميل صورة"><i class="fa-solid fa-download"></i></button>
                            </div>
                        </div>

                        <div class="canvas-fullscreen-container bg-white" id="canvas-container">
                            <canvas id="whiteboard"></canvas>
                        </div>
                    </section>

                    <!-- تبويب الكاميرات -->
                    <section id="tab-cameras" class="tab-content">
                        <div class="cameras-grid" id="cameras-grid"></div>
                        <div class="floating-cam" id="floating-cam">
                            <video id="my-pip-video" autoplay muted playsinline></video>
                            <span>كاميرتك</span>
                        </div>
                    </section>

                    <!-- تبويب مشاركة الشاشة -->
                    <section id="tab-screen" class="tab-content full-content">
                        <div class="screen-top-bar">
                            <button class="btn btn-primary host-only" onclick="startScreenShare()"><i class="fa-solid fa-desktop"></i> بدء مشاركة الشاشة</button>
                            <button class="btn btn-warning" id="presentation-btn" onclick="togglePresentation()"><i class="fa-solid fa-expand"></i> وضعية الشرح للجميع</button>
                            <button class="btn btn-secondary" id="laser-btn" onclick="toggleLaser()"><i class="fa-solid fa-wand-magic-sparkles"></i> مؤشر الليزر</button>
                            <button class="btn btn-danger host-only" id="record-btn" onclick="toggleRecording()"><i class="fa-solid fa-circle"></i> بدء تسجيل المحاضرة</button>
                        </div>
                        <div class="screen-fullscreen-wrapper" id="screen-wrapper">
                            <video id="shared-screen-video" autoplay playsinline></video>
                            <div id="laser-pointer" class="laser-pointer"></div>
                        </div>
                    </section>

                    <!-- تبويب الشات -->
                    <section id="tab-chat" class="tab-content">
                        <div class="modern-chat-card">
                            <div class="chat-header-bar">
                                <h3><i class="fa-solid fa-comments"></i> المحادثة المباشرة</h3>
                            </div>
                            <div class="modern-chat-messages" id="chat-messages">
                                <!-- الرسائل بتنزل هنا -->
                            </div>
                            <div class="chat-input-bar">
                                <label class="chat-attach-btn" title="إرفاق صورة أو ملف">
                                    <i class="fa-solid fa-paperclip"></i>
                                    <input type="file" id="chat-file-input" onchange="sendChatFile(event)" hidden>
                                </label>
                                <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatKey(event)">
                                <button class="btn btn-primary" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i> إرسال</button>
                            </div>
                        </div>
                    </section>

                </main>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
